name: example
description: Super Text Layout example app

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.6.0

  super_text_layout:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/Roboto-Regular.ttf
  fonts:
    - family: FlowDemo
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
    - family: FlowCode
      fonts:
        - asset: assets/fonts/FiraMono-Regular.ttf
