name: flow_layout_prototype
description: Standalone feasibility experiment for fragmentable inline widgets.
publish_to: none
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  super_text_layout:
    path: ../
dev_dependencies:
  args: ^2.7.0
  path: ^1.9.1
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Roboto-Regular.ttf
  fonts:
    - family: FlowDemo
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
    - family: FlowCode
      fonts:
        - asset: assets/fonts/FiraMono-Regular.ttf
